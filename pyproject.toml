[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scuttle-search"
version = "0.3.0"
description = "Scuttle: Frontier-calibrated 1.7B decision model and MCP server for fast parallel swarm graph search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.46",
    "huggingface_hub>=0.25",
    "safetensors>=0.4",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43", "accelerate>=0.30"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
scuttle = "scuttle.cli:main"
scuttle-mcp = "scuttle.mcp_server:main"
scuttle-serve = "scuttle.serve:main"

[tool.setuptools.packages.find]
include = ["scuttle*"]
